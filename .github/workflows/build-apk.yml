name: Build Smart Touch Console APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack ZIP if uploaded directly from phone
        run: |
          if [ -f "SmartTouchConsole_Android_Project.zip" ]; then
            rm -rf app SmartTouchConsole
            unzip -o SmartTouchConsole_Android_Project.zip
          fi
          if [ -d "SmartTouchConsole" ] && [ -f "SmartTouchConsole/settings.gradle.kts" ]; then
            cp -rf SmartTouchConsole/. .
            rm -rf SmartTouchConsole
          fi

      - name: Download offline Russian speech model (Vosk small-ru)
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o /tmp/vosk-ru.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          unzip -q /tmp/vosk-ru.zip -d /tmp/vosk-ru
          rm -rf app/src/main/assets/model-ru
          mv /tmp/vosk-ru/vosk-model-small-ru-0.22 app/src/main/assets/model-ru
          ls app/src/main/assets/model-ru

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Signed Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartTouchConsole-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish OTA APK to Latest Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-ota --yes --cleanup-tag || true
          gh release create latest-ota app/build/outputs/apk/debug/app-debug.apk --latest --target "${{ github.sha }}" --title "Smart Touch Console OTA" --notes "Signed OTA APK build ${{ github.sha }}"
